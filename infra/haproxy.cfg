frontend http_in
    bind *:80
    mode tcp
    default_backend envoy_nodes

backend envoy_nodes
    mode tcp
    balance roundrobin
    server worker01 10.20.92.118:32080 check send-proxy

frontend https_in
    bind *:443
    mode tcp
    default_backend envoy_nodes_tls

backend envoy_nodes_tls
    mode tcp
    balance roundrobin
    server worker01 10.20.92.118:32443 check send-proxy

