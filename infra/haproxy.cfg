# resolvers mydns
#    nameserver dns1 10.x.x.x     # your DNS server / router / cloud resolver
#    resolve_retries 3
#    timeout resolve 1s
#    timeout retry   1s
#    hold valid      10s               

frontend http_in
    bind *:80
    mode tcp
    default_backend envoy_nodes

backend envoy_nodes
    mode tcp
    balance roundrobin
    server worker01 10.46.75.118:32080 check send-proxy
    # server worker01 worker-01.lab.dakky.xyz:32080 check send-proxy resolvers mydns init-addr none  #Use domain name when its stable for ease-of-use

frontend https_in
    bind *:443
    mode tcp
    default_backend envoy_nodes_tls

backend envoy_nodes_tls
    mode tcp
    balance roundrobin
    server worker01 10.46.75.118:32443 check send-proxy
    # server worker01 worker-01.lab.dakky.xyz:32080 check send-proxy resolvers mydns init-addr none  #Use domain name when its stable for ease-of-use

