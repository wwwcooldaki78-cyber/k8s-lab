apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: juice-shop
  namespace: juice-shop
spec:
  parentRefs:
    - name: juice-gateway
      sectionName: https
  hostnames:
    - juice.lab.dakky.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: "max-age=300"
      backendRefs:
        - name: juice-shop
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: juice-shop-redirect
  namespace: juice-shop
spec:
  parentRefs:
    - name: juice-gateway
      sectionName: http
  hostnames:
    - juice.lab.dakky.xyz
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
